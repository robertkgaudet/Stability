<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="UTF-8">
	<title>Team Member Removed</title>
	<link rel="stylesheet" href="https://stability.org/Homer/styles/style.css">
	<link rel="stylesheet" href="https://stability.org/Homer/vendor/bootstrap/dist/css/bootstrap.css" />
	<link rel="stylesheet" href="https://stability.org/Homer/vendor/bootstrap-toggle-master/css/bootstrap2-toggle.css" />
	<style>
		body {
			font-family: Arial, sans-serif;
			background-color: #F4F4F4;
			padding: 10px;
			color: #333;
		}

		.email-container {
			background: #fff;
			border: double 3px #E3E3E3;
			padding: 30px 50px;
			box-sizing: border-box;
			border-radius: 8px;
		}

		.header {
			background-color: #393F4F;
			padding: 20px;
			text-align: left;
		}

			.header img {
				height: 40px;
			}

		a {
			color: #007bff;
			text-decoration: none;
		}
	</style>
</head>
<body>
	<div style="margin: 20px auto; width: 85%;">
		<!-- Header -->
		<div class="header">
			<a href="http://www.Stability.org" target="_blank">
				<img src="http://www.Stability.org/V1/Images/logo-w-c.png" alt="Stability Logo">
			</a>
		</div>

		<!-- Email Content -->
		<div class="email-container">

			<p>Dear <strong>##TeamOwnerFirstName## ##TeamOwnerLastName##</strong>,</p>

			<p>This is to inform you that <strong>##RemovedMemberFirstName## ##RemovedMemberLastName##</strong> has been removed from your team <strong>##OrganizationName##</strong>.</p>

			<p>If you have any questions, feel free to contact us at <a href="mailto:Support@Impactoid.com">Support@Impactoid.com</a>.</p>

			<p>Sincerely,<br><strong>Stability Team</strong></p>

		</div>
	</div>
</body>
</html>
